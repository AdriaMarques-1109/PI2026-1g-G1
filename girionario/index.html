<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Girionario - Página inicial</title>

        <link rel="stylesheet" type="text/css" href="css/css-index.css">

    </head>
    <body>
        <header>
            <img src="imagens/logo-ifc-vertical.png" alt="Logo do IFC" id="logo-if">
        </header>

        <div id="titulo">
            <h3>Dicionário de Gírias</h3>
            <img src="imagens/logo_girionario.png" alt="Logo do Girionário">
            <h1>Girionário</h1>
            <p>Descubra as gírias, expressões e o vocabulário único de cada canto do Brasil. Do Sul ao Norte, do Nordeste ao Centro-Oeste. 🇧🇷</p>
        </div>
       <nav id="menu-de-navegacao">
            <ol>
                <li><a href="index.html">Página inicial</a></li>
                <li><a href="pagina_de_submissão.html">Submissão</a></li>
            </ol>
       </nav>
       <aside id="menu-por-regiao" class="menu-por-regiao">
            <h3>Pesquise por região</h3>
            <ul>
                <li><button class="btn-filtro ativo" data-classe="todos">Todos</button></li>
                <li><button class="btn-filtro" data-classe="norte">Norte</button></li>
                <li><button class="btn-filtro" data-classe="nordeste">Nordeste</button></li>
                <li><button class="btn-filtro" data-classe="centro-oeste">Centro-Oeste</button></li>
                <li><button class="btn-filtro" data-classe="sudeste">Sudeste</button></li>
                <li><button class="btn-filtro" data-classe="sul">Sul</button></li>
            </ul>
            </aside>
        <main>
            <div id="cards-container" class="grid-cards"></div>

            <script>
                //Banco de dados
                const bancoDeDadosCards = [
                    { titulo: "De bubuia", classe: "norte", texto: "Ficar sem fazer nada, descansando.", detalhes: "Vem do verbo bubuiar, de origem tupi, que significa 'boiar' ou 'flutuar'." },
                    { titulo: "Card Beta", classe: "classe-2", texto: "Resumo do Card Beta.", detalhes: "Detalhes profundos do Card Beta da Classe 2." },
                    { titulo: "Card Gamma", classe: "classe-3", texto: "Resumo do Card Gamma.", detalhes: "Detalhes profundos do Card Gamma da Classe 3." },
                    { titulo: "Card Delta", classe: "classe-4", texto: "Resumo do Card Delta.", detalhes: "Detalhes profundos do Card Delta da Classe 4." },
                    { titulo: "Card Epsilon", classe: "classe-5", texto: "Resumo do Card Epsilon.", detalhes: "Detalhes profundos do Card Epsilon da Classe 5." },
                    { titulo: "Card Zeta", classe: "classe-1", texto: "Resumo do Card Zeta.", detalhes: "Detalhes profundos do Card Zeta da Classe 1." },
                    { titulo: "Card Eta", classe: "classe-2", texto: "Resumo do Card Eta.", detalhes: "Detalhes profundos do Card Eta da Classe 2." },
                    { titulo: "Card Theta", classe: "classe-3", texto: "Resumo do Card Theta.", detalhes: "Detalhes profundos do Card Theta da Classe 3." },
                    { titulo: "Card Iota", classe: "classe-4", texto: "Resumo do Card Iota.", detalhes: "Detalhes profundos do Card Iota da Classe 4." },
                    { titulo: "Card Kappa", classe: "classe-5", texto: "Resumo do Card Kappa.", detalhes: "Detalhes profundos do Card Kappa da Classe 5." }
                ];

                //número d cards exibidos
                const totalParaExibir = 4;

                //embaralhar o array completo
                function embaralhar(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
                }

                function renderizarCardsSorteados() {
                const container = document.getElementById("cards-container");
                container.innerHTML = "";
                
                // Embaralha a lista completa
                const listaSorteada = embaralhar([...bancoDeDadosCards]).slice(0, totalParaExibir);
                
                listaSorteada.forEach(card => {
                    const div = document.createElement("div");
                    div.className = "card-item";
                    div.setAttribute("data-classe", card.classe); 
                    
                    div.innerHTML = `
                    <span class="tag ${card.classe}">${card.classe.replace("-", " ")}</span>
                    <h3>${card.titulo}</h3>
                    <p class="resumo">${card.texto}</p>
                    <div class="mais-info">${card.detalhes}</div>
                    `;
                    
                    div.addEventListener("click", () => {
                    document.querySelectorAll(".card-item.expandido").forEach(aberto => {
                        if (aberto !== div) aberto.classList.remove("expandido");
                    });
                    div.classList.toggle("expandido");
                    });

                    container.appendChild(div);
                });
                }

                function configurarFiltros() {
                const botoes = document.querySelectorAll(".btn-filtro");
                
                botoes.forEach(botao => {
                    botao.addEventListener("click", () => {
                    document.querySelector(".btn-filtro.ativo").classList.remove("ativo");
                    botao.classList.add("ativo");

                    const classeAlvo = botao.getAttribute("data-classe");
                    const cards = document.querySelectorAll(".card-item");
                    
                    cards.forEach(card => {
                        const classeCard = card.getAttribute("data-classe");
                        
                        if (classeAlvo === "todos" || classeCard === classeAlvo) {
                        card.style.display = "block"; 
                        } else {
                        card.style.display = "none";
                        card.classList.remove("expandido");
                        }
                    });
                    });
                });
                }


                window.onload = () => {
                renderizarCardsSorteados();
                configurarFiltros();
                };
            </script>
        </main>
        <footer>
            &copy; 2026 Girionário
        </footer>
    </body>
</html>
