<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Girionario - Página inicial</title>

        <link rel="stylesheet" type="text/css" href="../girionario/css/style.css">
        <link rel="stylesheet" href="css/submissao.css">
        <script src="../girionario/js/arquivo.js" defer></script>
 
    </head>
    <body>
        <header>
            <div id="titulo" class="header header-container">
                <h3 class="sub-title">Dicionário de Gírias</h3>
                <br>
                <img src="imagens/logo-girionario.png" alt="Logo do Girionário" class="logo-livro"> <h1 class="main-title">Girionário</h1>
                <br>
                <p class="description">Descubra as gírias, expressões e o vocabulário único de cada canto do Brasil. Do Sul ao Norte, do Nordeste ao Centro-Oeste.</p>
                <br>
                <div class="busca-container">
                    <input type="text" id="campo-busca" placeholder="Pesquisar gíria ou significado..." autocomplete="off"/>
                </div>
            </div>

             <br><br>

            <nav id="menu-de-navegacao">
                <ol>
                    <li><a href="index.html">Página inicial</a></li>
                    <li><a href="submissao.html">Sugestões</a></li>
                </ol>
            </nav>
        </header>
       <aside id="menu-por-regiao" class="menu-por-regiao">
            <h3>Pesquise por região</h3>
            <ul class="menu-por-regiao">
                <li><button class="btn-filtro ativo" data-classe="todos">Todos</button></li>
                <li><button class="btn-filtro" data-classe="norte">Norte</button></li>
                <li><button class="btn-filtro" data-classe="nordeste">Nordeste</button></li>
                <li><button class="btn-filtro" data-classe="centro-oeste">Centro-Oeste</button></li>
                <li><button class="btn-filtro" data-classe="sudeste">Sudeste</button></li>
                <li><button class="btn-filtro" data-classe="sul">Sul</button></li>
            </ul>
            </aside>
        <main>
            <div id="cards-container" class="grid-cards"></div>


        </main>
        <footer>
            &copy; 2026 Girionário
            <img src="imagens/logo-ifc-ibirama.png" alt="Logo do IFC" class="logo-ifc">
            <div class="mapa">
                <a href="index.html" class="mapa-a" style="text-decoration: none;">Página inicial</a>
                <br>
                <a href="submissao.html" class="mapa-a" style="text-decoration: none;">Página de Sugestões</a>
            </div>
        </footer>
    </body>
</html>
